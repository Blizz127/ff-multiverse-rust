[package]
name = "fmv-protocol"
description = "Versioned FF Multiverse wire protocol: messages and length-prefixed framing. Never carries asset bytes."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fmv-core.workspace = true
# The party messages carry fmv-party's own serde types (events, party, invites, placement) so a
# client mirror replays exactly what the party state machine decided. Pinned by golden JSON tests.
fmv-party = { path = "../fmv-party" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio.workspace = true
