[package]
name = "fmv-audio"
description = "FF Multiverse audio engine: music/SFX mixer, null sink and cpal output."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["device"]
# The real output device through cpal (ALSA; PipeWire serves it via pipewire-alsa). Without this
# feature only the null sink exists, so a machine without the ALSA headers can still build.
device = ["dep:cpal"]

[dependencies]
cpal = { version = "0.18", optional = true }
# Decoders for the owner's own sound files, read-only. Ogg/Vorbis for music; WAV/PCM/ADPCM for effects.
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "adpcm"] }
