[package]
name = "fmv-client"
description = "FF Multiverse client (window + headless bot mode)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fmv-core.workspace = true
fmv-protocol.workspace = true
fmv-adapter-api.workspace = true
fmv-fixture.workspace = true
# FF7 wiring: the adapter over this machine's own flevel.lgp and the imported-content library it
# is resolved from (both read-only; nothing here writes into the library or an install).
fmv-ff7.workspace = true
fmv-library.workspace = true
# The battle engine this client replays (from its OWN scene.bin and kernel.bin; path dependency like
# fmv-protocol's, it is not a workspace dependency entry).
fmv-ff7-battle = { path = "../fmv-ff7-battle" }
# Music and effects: the mixer, the null sink and the cpal output device (path dependency).
fmv-audio = { path = "../fmv-audio" }
# The optional community-mod layers over the owner's own content (Echo-S's script, voices and music; Cosmo Memory's sounds):
# a read-only reader for the owner's own .iro archives (path dependency).
fmv-mods = { path = "../fmv-mods" }
# The mods' settings file (a small JSON object of booleans).
serde_json.workspace = true
blake3.workspace = true
tokio.workspace = true
clap.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
bytemuck.workspace = true
# Game controllers (SDL-style button/axis names, hot-plug) for the launcher's Steam Game Mode device
# check: src/gamepad.rs turns pad input into the same key events the keyboard path handles.
gilrs = "0.11"

[dev-dependencies]
# Paused-clock liveness tests (deterministic under load). `test-util` only enables tokio's
# own features (rt, sync, time): it adds no packages, so Cargo.lock is unaffected.
tokio = { workspace = true, features = ["test-util"] }
# Hermetic temporary libraries for the FF7 source tests.
tempfile.workspace = true
# Synthetic mod archives (invented names and bytes) for the layers' tests.
fmv-mods = { path = "../fmv-mods", features = ["testkit"] }
