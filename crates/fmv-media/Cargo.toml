[package]
name = "fmv-media"
description = "Bounded external movie decoder and explicit presentation timeline."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the workspace lock: safe nonblocking child pipes enforce cancellation
# even if a selected wrapper leaves an inherited pipe open after its own exit.
rustix = { version = "1.1.6", features = ["fs", "event"] }

[dev-dependencies]
tempfile.workspace = true
