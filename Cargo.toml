[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
fmv-core = { path = "crates/fmv-core" }
fmv-protocol = { path = "crates/fmv-protocol" }
fmv-adapter-api = { path = "crates/fmv-adapter-api" }
fmv-fixture = { path = "crates/fmv-fixture" }
fmv-library = { path = "crates/fmv-library" }
fmv-ff7 = { path = "crates/fmv-ff7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
winit = "0.30"
wgpu = "30"
pollster = "1"
dirs = "7"
hex = "0.4"
tempfile = "3"

[profile.dev]
opt-level = 1
