[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
fmv-core = { path = "crates/fmv-core" }
fmv-protocol = { path = "crates/fmv-protocol" }
fmv-adapter-api = { path = "crates/fmv-adapter-api" }
fmv-fixture = { path = "crates/fmv-fixture" }
fmv-library = { path = "crates/fmv-library" }
fmv-ff7 = { path = "crates/fmv-ff7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
winit = "0.30"
wgpu = "30"
pollster = "1"
dirs = "7"
hex = "0.4"
tempfile = "3"
# Display-name policy in fmv-core (NFC/NFKC normalization and Unicode script data). ICU4X's
# normalizer is used without its default features: they only add UTF-16 helpers.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
unicode-script = "0.5"

[profile.dev]
opt-level = 1

# The decoders are the one heavy loop of a debug build: the client decodes the owner's music (minutes of
# Vorbis per track) and a fight cannot wait seconds for its theme. Optimised decoders keep that short;
# nothing else about the dev profile changes.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-utils-xiph]
opt-level = 3
